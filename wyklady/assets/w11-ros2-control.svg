<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Source Sans Pro, Segoe UI, sans-serif" font-size="17">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="#fff"/>
  <!-- użytkownicy -->
  <rect x="20" y="20" width="200" height="54" rx="8" fill="#eef4fa" stroke="#1f5f99" stroke-width="2"/>
  <text x="120" y="44" text-anchor="middle" font-weight="700">MoveIt (move_group)</text>
  <text x="120" y="64" text-anchor="middle" font-size="14">planowanie ruchu</text>
  <rect x="250" y="20" width="200" height="54" rx="8" fill="#eef4fa" stroke="#1f5f99" stroke-width="2"/>
  <text x="350" y="44" text-anchor="middle" font-weight="700">Twój węzeł (L4)</text>
  <text x="350" y="64" text-anchor="middle" font-size="14">rclpy</text>
  <!-- controller manager -->
  <rect x="20" y="110" width="680" height="150" rx="10" fill="#fbe7e8" stroke="#9d1c20" stroke-width="2.5"/>
  <text x="688" y="137" text-anchor="end" font-weight="700" fill="#9d1c20">controller_manager</text>
  <rect x="40" y="150" width="200" height="90" rx="6" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="140" y="175" text-anchor="middle" font-size="15" font-weight="700">joint_trajectory_</text>
  <text x="140" y="193" text-anchor="middle" font-size="15" font-weight="700">controller</text>
  <text x="140" y="215" text-anchor="middle" font-size="13">akcja FollowJointTrajectory</text>
  <text x="140" y="231" text-anchor="middle" font-size="13">interpolacja q(t)</text>
  <rect x="260" y="150" width="200" height="90" rx="6" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="360" y="175" text-anchor="middle" font-size="15" font-weight="700">forward_position_</text>
  <text x="360" y="193" text-anchor="middle" font-size="15" font-weight="700">controller</text>
  <text x="360" y="215" text-anchor="middle" font-size="13">temat Float64MultiArray</text>
  <text x="360" y="231" text-anchor="middle" font-size="13">q zadane wprost</text>
  <rect x="480" y="150" width="200" height="90" rx="6" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="580" y="175" text-anchor="middle" font-size="15" font-weight="700">joint_state_</text>
  <text x="580" y="193" text-anchor="middle" font-size="15" font-weight="700">broadcaster</text>
  <text x="580" y="215" text-anchor="middle" font-size="13">publikuje /joint_states</text>
  <!-- interfejsy -->
  <rect x="20" y="295" width="680" height="44" rx="6" fill="#f5f5f7" stroke="#555" stroke-width="1.5"/>
  <text x="360" y="323" text-anchor="middle">Resource Manager: interfejsy <tspan font-weight="700">command</tspan> (position, velocity) i <tspan font-weight="700">state</tspan> (position, velocity)</text>
  <!-- hardware -->
  <rect x="20" y="365" width="330" height="50" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="185" y="395" text-anchor="middle" font-weight="700">gz_ros2_control → Gazebo (L4)</text>
  <rect x="370" y="365" width="330" height="50" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="535" y="395" text-anchor="middle" font-weight="700">ur_robot_driver → prawdziwy UR</text>
  <!-- strzałki -->
  <g stroke="#333" stroke-width="2" fill="none">
    <path d="M120,74 L120,146" marker-end="url(#a)"/>
    <path d="M280,74 L215,146" marker-end="url(#a)"/>
    <path d="M360,74 L360,146" marker-end="url(#a)"/>
    <path d="M140,240 L140,291" marker-end="url(#a)"/>
    <path d="M360,240 L360,291" marker-end="url(#a)"/>
    <path d="M580,291 L580,244" marker-end="url(#a)"/>
    <path d="M185,339 L185,361" marker-end="url(#a)"/>
    <path d="M535,339 L535,361" marker-end="url(#a)"/>
  </g>
  <!-- prawa kolumna: opis -->
  <text x="725" y="120" font-size="15" font-weight="700" fill="#9d1c20">controller_manager:</text>
  <text x="725" y="139" font-size="14">pętla read → update → write</text>
  <text x="725" y="157" font-size="14">o stałym okresie (np. 500 Hz)</text>
  <text x="725" y="192" font-size="15" font-weight="700">Ta sama góra, różny dół:</text>
  <text x="725" y="212" font-size="14">kontrolery nie wiedzą,</text>
  <text x="725" y="230" font-size="14">czy sterują symulacją,</text>
  <text x="725" y="248" font-size="14">czy prawdziwym robotem.</text>
  <text x="725" y="284" font-size="14">Przełączanie:</text>
  <text x="725" y="302" font-size="13" font-family="monospace">ros2 control</text>
  <text x="725" y="318" font-size="13" font-family="monospace">switch_controllers</text>
</svg>
