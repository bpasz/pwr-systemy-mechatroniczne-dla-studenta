<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Source Sans Pro, Segoe UI, sans-serif" font-size="20">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9d1c20"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>
  <!-- Zadanie -->
  <path d="M500,6 L500,46" stroke="#9d1c20" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#r)"/>
  <text x="512" y="30" font-size="15" fill="#9d1c20">zadanie (użytkownik, system nadrzędny)</text>
  <!-- Sterownik -->
  <rect x="355" y="50" width="290" height="90" rx="10" fill="#f3d2d3" stroke="#9d1c20" stroke-width="2.5"/>
  <text x="500" y="88" text-anchor="middle" font-weight="700">Sterownik</text>
  <text x="500" y="116" text-anchor="middle" font-size="16">MCU / PLC / komputer + algorytm</text>
  <!-- Element wykonawczy -->
  <rect x="700" y="190" width="260" height="80" rx="10" fill="#eef4fa" stroke="#1f5f99" stroke-width="2.5"/>
  <text x="830" y="223" text-anchor="middle" font-weight="700">Element wykonawczy</text>
  <text x="830" y="250" text-anchor="middle" font-size="16">silnik, serwo, zawór</text>
  <!-- Układ mechaniczny -->
  <rect x="355" y="320" width="290" height="80" rx="10" fill="#f5f5f7" stroke="#555" stroke-width="2.5"/>
  <text x="500" y="353" text-anchor="middle" font-weight="700">Układ mechaniczny</text>
  <text x="500" y="380" text-anchor="middle" font-size="16">przekładnia, ramię, kabina</text>
  <!-- Czujnik -->
  <rect x="40" y="190" width="260" height="80" rx="10" fill="#eef7ee" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="170" y="223" text-anchor="middle" font-weight="700">Czujnik</text>
  <text x="170" y="250" text-anchor="middle" font-size="16">enkoder, krańcówka, kamera</text>
  <!-- Strzałki: odcinki prostopadłe, opisy obok odcinków poziomych -->
  <g fill="none" stroke="#333" stroke-width="2.5">
    <path d="M645,95 L830,95 L830,186" marker-end="url(#a)"/>
    <path d="M830,270 L830,360 L649,360" marker-end="url(#a)"/>
    <path d="M355,360 L170,360 L170,274" marker-end="url(#a)"/>
    <path d="M170,190 L170,95 L351,95" marker-end="url(#a)"/>
  </g>
  <g font-size="16" fill="#333" text-anchor="middle">
    <text x="737" y="84">sygnał sterujący</text>
    <text x="737" y="384">siła / moment</text>
    <text x="262" y="384">wielkość fizyczna</text>
    <text x="262" y="84">pomiar (sygnał)</text>
  </g>
  <text x="500" y="236" text-anchor="middle" font-size="17" fill="#9d1c20">pętla sprzężenia zwrotnego</text>
</svg>
