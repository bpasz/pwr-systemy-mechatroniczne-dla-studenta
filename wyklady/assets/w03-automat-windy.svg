<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 490" font-family="Source Sans Pro, Segoe UI, sans-serif" font-size="18">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9d1c20"/>
    </marker>
  </defs>
  <rect width="1040" height="490" fill="#fff"/>
  <!-- stany -->
  <g stroke-width="2.5">
    <ellipse cx="190" cy="150" rx="110" ry="45" fill="#eef4fa" stroke="#1f5f99"/>
    <ellipse cx="620" cy="150" rx="110" ry="45" fill="#eef7ee" stroke="#2e7d32"/>
    <ellipse cx="405" cy="370" rx="140" ry="45" fill="#f5f5f7" stroke="#555"/>
    <ellipse cx="880" cy="370" rx="105" ry="45" fill="#f3d2d3" stroke="#9d1c20"/>
  </g>
  <text x="190" y="146" text-anchor="middle" font-weight="700">POSTÓJ</text>
  <text x="190" y="170" text-anchor="middle" font-size="15">drzwi zamknięte</text>
  <text x="620" y="146" text-anchor="middle" font-weight="700">JAZDA</text>
  <text x="620" y="170" text-anchor="middle" font-size="15">silnik włączony</text>
  <text x="405" y="366" text-anchor="middle" font-weight="700">DRZWI_OTWARTE</text>
  <text x="405" y="390" text-anchor="middle" font-size="15">serwo otwarte, odliczanie 3 s</text>
  <text x="880" y="366" text-anchor="middle" font-weight="700">AWARIA</text>
  <text x="880" y="390" text-anchor="middle" font-size="15">silnik wyłączony, alarm</text>
  <!-- stan początkowy -->
  <circle cx="36" cy="150" r="9" fill="#333"/>
  <path d="M46,150 L76,150" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- przejścia -->
  <g fill="none" stroke="#333" stroke-width="2.2">
    <path d="M300,150 L506,150" marker-end="url(#a)"/>
    <path d="M575,192 C560,260 540,300 507,332" marker-end="url(#a)"/>
    <path d="M268,358 C200,335 160,270 155,199" marker-end="url(#a)"/>
    <path d="M232,192 C255,250 285,295 322,330" marker-end="url(#a)"/>
    <path d="M705,178 C790,210 840,260 858,321" marker-end="url(#r)" stroke="#9d1c20" stroke-dasharray="6 4"/>
    <path d="M983,355 C1080,220 960,50 666,104" marker-end="url(#r)" stroke="#9d1c20"/>
  </g>
  <!-- opisy przejść: zawsze obok łuku, nie na nim -->
  <text x="403" y="112" text-anchor="middle" font-size="15">wezwanie z innego piętra</text>
  <text x="403" y="132" text-anchor="middle" font-size="14" fill="#555">/ wybierz cel, EN=0</text>
  <text x="592" y="258" font-size="15">pozycja == cel</text>
  <text x="592" y="277" font-size="14" fill="#555">/ EN=1, otwórz drzwi, gong</text>
  <text x="28" y="268" font-size="15">po 3 s</text>
  <text x="28" y="287" font-size="14" fill="#555">/ zamknij drzwi</text>
  <text x="290" y="238" font-size="15">wezwanie z tego piętra</text>
  <text x="290" y="257" font-size="14" fill="#555">/ otwórz drzwi</text>
  <text x="858" y="236" font-size="15" fill="#9d1c20">STOP</text>
  <text x="858" y="255" font-size="15" fill="#9d1c20">(z każdego stanu)</text>
  <text x="790" y="58" font-size="15" fill="#9d1c20">STOP zwolniony</text>
  <text x="790" y="77" font-size="14" fill="#555">/ dojedź do piętra</text>
  <text x="520" y="470" text-anchor="middle" font-size="15" fill="#555">notacja: zdarzenie / akcja</text>
</svg>
