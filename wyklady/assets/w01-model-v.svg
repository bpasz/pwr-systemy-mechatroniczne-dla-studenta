<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Source Sans Pro, Segoe UI, sans-serif" font-size="18">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#fff"/>
  <!-- lewa gałąź -->
  <rect x="20" y="20" width="230" height="56" rx="8" fill="#f3d2d3" stroke="#9d1c20" stroke-width="2"/>
  <text x="135" y="54" text-anchor="middle" font-weight="700">Wymagania</text>
  <rect x="90" y="120" width="230" height="56" rx="8" fill="#f3d2d3" stroke="#9d1c20" stroke-width="2"/>
  <text x="205" y="146" text-anchor="middle" font-weight="700">Projekt systemu</text>
  <text x="205" y="166" text-anchor="middle" font-size="14">architektura, podział na bloki</text>
  <!-- dziedziny -->
  <rect x="200" y="225" width="500" height="80" rx="8" fill="#eef4fa" stroke="#1f5f99" stroke-width="2"/>
  <text x="450" y="252" text-anchor="middle" font-weight="700">Projekt dziedzinowy</text>
  <text x="300" y="285" text-anchor="middle" font-size="16">mechanika</text>
  <text x="450" y="285" text-anchor="middle" font-size="16">elektronika</text>
  <text x="600" y="285" text-anchor="middle" font-size="16">oprogramowanie</text>
  <!-- prawa gałąź -->
  <rect x="580" y="120" width="230" height="56" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="695" y="146" text-anchor="middle" font-weight="700">Integracja systemu</text>
  <text x="695" y="166" text-anchor="middle" font-size="14">HIL, SIL, testy bloków razem</text>
  <rect x="650" y="20" width="230" height="56" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="765" y="54" text-anchor="middle" font-weight="700">Weryfikacja / walidacja</text>
  <!-- strzałki -->
  <path d="M135,76 L180,116" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <path d="M220,176 L300,221" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <path d="M600,221 L680,180" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <path d="M720,116 L765,80" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <!-- poziome sprawdzenia -->
  <path d="M250,48 L646,48" stroke="#9d1c20" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <path d="M320,148 L576,148" stroke="#9d1c20" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="450" y="40" text-anchor="middle" font-size="14" fill="#9d1c20">czy spełnia wymagania?</text>
  <text x="450" y="140" text-anchor="middle" font-size="14" fill="#9d1c20">czy bloki współpracują?</text>
  <!-- modelowanie -->
  <rect x="120" y="340" width="660" height="44" rx="8" fill="#f5f5f7" stroke="#888" stroke-width="1.5"/>
  <text x="450" y="368" text-anchor="middle" font-size="16">Modelowanie i symulacja towarzyszą każdemu etapowi (cyfrowy bliźniak)</text>
</svg>
