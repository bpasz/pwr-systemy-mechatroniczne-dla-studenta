<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Source Sans Pro, Segoe UI, sans-serif" font-size="18">
  <rect width="640" height="400" fill="#fff"/>
  <g stroke-width="2">
    <rect x="20" y="16" width="470" height="60" rx="6" fill="#f3d2d3" stroke="#9d1c20"/>
    <rect x="20" y="86" width="470" height="60" rx="6" fill="#fbe7e8" stroke="#9d1c20"/>
    <rect x="20" y="156" width="470" height="60" rx="6" fill="#eef4fa" stroke="#1f5f99"/>
