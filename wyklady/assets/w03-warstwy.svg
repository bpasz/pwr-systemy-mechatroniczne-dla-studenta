  <text x="36" y="42" font-weight="700">4. STM32duino (API Arduino)</text>
  <text x="36" y="64" font-size="15">digitalWrite(), analogRead(), HardwareTimer</text>
  <text x="36" y="112" font-weight="700">3. HAL (Hardware Abstraction Layer)</text>
  <text x="36" y="134" font-size="15">HAL_GPIO_WritePin(), HAL_TIM_Base_Start_IT()</text>
  <text x="36" y="182" font-weight="700">2. LL (Low Layer)</text>
  <text x="36" y="204" font-size="15">LL_GPIO_SetOutputPin(): funkcje inline nad rejestrami</text>
  <text x="36" y="252" font-weight="700">1. CMSIS: nazwy rejestrów i bitów</text>
  <text x="36" y="274" font-size="15">GPIOA-&gt;BSRR = GPIO_BSRR_BS5;  NVIC_EnableIRQ()</text>
  <text x="36" y="322" font-weight="700">0. Sprzęt: peryferia w mapie pamięci</text>
  <text x="36" y="344" font-size="15">*(volatile uint32_t *)0x50000018 = 1u &lt;&lt; 5;</text>
  <!-- klamry po prawej -->
  <g fill="none" stroke="#555" stroke-width="2">
    <path d="M505,20 L515,20 L515,72 L505,72"/>
    <path d="M505,90 L515,90 L515,282 L505,282"/>
  </g>
  <text x="522" y="42" font-size="14" fill="#555">rdzeń Arduino</text>
  <text x="522" y="60" font-size="14" fill="#555">(ST, kod otwarty)</text>
  <text x="522" y="176" font-size="14" fill="#555">pakiet</text>
  <text x="522" y="194" font-size="14" fill="#555">STM32Cube</text>
  <text x="522" y="212" font-size="14" fill="#555">(ST + ARM)</text>
  <text x="522" y="322" font-size="14" fill="#555">RM0490</text>
  <text x="522" y="340" font-size="14" fill="#555">(dokumentacja)</text>
  <text x="20" y="386" font-size="14" fill="#555">wyżej: wygoda i przenośność · niżej: kontrola, rozmiar kodu, szybkość</text>
