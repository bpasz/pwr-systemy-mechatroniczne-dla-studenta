<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Source Sans Pro, Segoe UI, sans-serif" font-size="18">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="960" height="300" fill="#fff"/>
  <g stroke-width="2.5">
    <rect x="20" y="40" width="200" height="110" rx="10" fill="#eef7ee" stroke="#2e7d32"/>
    <rect x="260" y="40" width="200" height="110" rx="10" fill="#eef4fa" stroke="#1f5f99"/>
    <rect x="500" y="40" width="200" height="110" rx="10" fill="#f3d2d3" stroke="#9d1c20"/>
    <rect x="740" y="40" width="200" height="110" rx="10" fill="#f5f5f7" stroke="#555"/>
  </g>
  <text x="120" y="72" text-anchor="middle" font-weight="700">1. Teleoperacja</text>
  <text x="120" y="100" text-anchor="middle" font-size="15">człowiek steruje robotem</text>
  <text x="120" y="120" text-anchor="middle" font-size="15">(ramię „leader”, klawiatura)</text>
  <text x="360" y="72" text-anchor="middle" font-weight="700">2. Nagranie</text>
  <text x="360" y="100" text-anchor="middle" font-size="15">LeRobotDataset:</text>
  <text x="360" y="120" text-anchor="middle" font-size="15">wideo + stan + akcja</text>
  <text x="600" y="72" text-anchor="middle" font-weight="700">3. Trening</text>
  <text x="600" y="100" text-anchor="middle" font-size="15">polityka π(a | o)</text>
  <text x="600" y="120" text-anchor="middle" font-size="15">ACT, Diffusion, SmolVLA</text>
  <text x="840" y="72" text-anchor="middle" font-weight="700">4. Wdrożenie</text>
  <text x="840" y="100" text-anchor="middle" font-size="15">polityka steruje</text>
  <text x="840" y="120" text-anchor="middle" font-size="15">robotem sama</text>
  <g stroke="#333" stroke-width="2.5" fill="none">
    <path d="M220,95 L256,95" marker-end="url(#a)"/>
    <path d="M460,95 L496,95" marker-end="url(#a)"/>
    <path d="M700,95 L736,95" marker-end="url(#a)"/>
    <path d="M840,150 C840,240 120,240 120,154" stroke-dasharray="7 5" marker-end="url(#a)"/>
  </g>
  <text x="480" y="232" text-anchor="middle" font-size="15" fill="#555">porażki wdrożenia = nowe demonstracje (więcej danych tam, gdzie polityka się myli)</text>
  <text x="480" y="280" text-anchor="middle" font-size="15" fill="#9d1c20">W L5 zaczynamy od kroku 2: gotowe zbiory i symulacja PushT, bez sprzętu.</text>
</svg>
