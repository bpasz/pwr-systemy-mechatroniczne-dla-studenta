<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" font-family="Source Sans Pro, Segoe UI, sans-serif" font-size="18">
  <rect width="520" height="330" fill="#fff"/>
  <g stroke="#222" stroke-width="2.5" fill="none">
    <polygon points="200,60 200,200 320,130" fill="#f5f5f7"/>
    <!-- wejście + -->
    <line x1="60" y1="90" x2="200" y2="90"/>
    <!-- wyjście -->
    <line x1="320" y1="130" x2="460" y2="130"/>
    <!-- sprzężenie R2 -->
    <line x1="400" y1="130" x2="400" y2="260"/>
    <rect x="310" y="250" width="60" height="20"/>
    <line x1="400" y1="260" x2="370" y2="260"/>
    <line x1="310" y1="260" x2="170" y2="260"/>
    <line x1="170" y1="170" x2="200" y2="170"/>
    <line x1="170" y1="170" x2="170" y2="260"/>
    <!-- R1 do masy -->
    <line x1="170" y1="260" x2="100" y2="260"/>
    <rect x="40" y="250" width="60" height="20"/>
    <line x1="40" y1="260" x2="20" y2="260"/>
    <line x1="20" y1="260" x2="20" y2="290"/>
    <line x1="5" y1="290" x2="35" y2="290"/>
    <line x1="11" y1="298" x2="29" y2="298"/>
  </g>
  <circle cx="400" cy="130" r="4" fill="#222"/>
  <circle cx="170" cy="260" r="4" fill="#222"/>
  <text x="208" y="97" font-size="22">+</text>
  <text x="210" y="178" font-size="26">−</text>
  <text x="30" y="85" fill="#9d1c20">u<tspan baseline-shift="sub" font-size="13">we</tspan></text>
  <text x="465" y="125" fill="#9d1c20">u<tspan baseline-shift="sub" font-size="13">wy</tspan></text>
  <text x="340" y="244" text-anchor="middle">R₂</text>
  <text x="70" y="244" text-anchor="middle">R₁</text>
  <text x="260" y="315" text-anchor="middle" font-size="20">u<tspan baseline-shift="sub" font-size="13">wy</tspan> = (1 + R₂/R₁) · u<tspan baseline-shift="sub" font-size="13">we</tspan></text>
</svg>
